name: Flutter Timer CI/CD

# Runs after a pull request is merged (a push lands on main) and on demand.
# Pull requests do not run CI any more - only merged work is built and released.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Publish (or refresh) the release for the current pubspec version'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Disable Analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Disable Analytics
        run: flutter config --no-analytics

      # web/ is checked in, so no `flutter create .` scaffolding step is needed
      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  build-windows:
    name: Build Windows (portable)
    runs-on: windows-2022
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Disable Analytics
        run: flutter config --no-analytics

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      # windows/ is checked in, so no `flutter create .` scaffolding step is needed
      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release

      # The release tag always comes from pubspec.yaml, so bumping the version
      # there is what produces a new release.
      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $semver = ($line -split '\+')[0]
          $tag = "v$semver"
          "full=$line" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "pubspec version: $line -> $tag"

      - name: Package portable build
        id: package
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          if (-not (Test-Path (Join-Path $release 'my_timer.exe'))) {
            throw "Windows build missing at $release"
          }

          $stage = 'dist\NOIR-CHROME'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $release '*') $stage -Recurse -Force

          # Everything the app needs is already in that folder; the readme just
          # tells people they do not have to install anything.
          $lines = @(
            'NOIR CHROME - portable Windows build ' + '${{ steps.version.outputs.tag }}',
            '',
            'This folder is fully portable: no installer, no runtime, no registry.',
            'Copy it anywhere and run my_timer.exe.',
            '',
            'Controls:',
            '  Space    start / pause',
            '  R        reset',
            '  C        toggle the 3-minute cycle',
            '  F        focus mode (Esc leaves it)',
            '  T        custom timer',
            '',
            'Built from https://github.com/' + '${{ github.repository }}'
          )
          $lines | Set-Content -Path (Join-Path $stage 'README.txt') -Encoding utf8

          $zip = "dist\NOIR-CHROME-windows-x64-${{ steps.version.outputs.tag }}.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Packaged $zip ($size MB)"
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload Portable Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-CHROME-windows-x64-${{ steps.version.outputs.tag }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Check whether this version is already released
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $exists = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          Write-Host "release $tag exists: $exists"
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          # A missing release is not an error, but `gh` exits 1 and GitHub's
          # pwsh wrapper ends the step with $LASTEXITCODE - so clear it.
          exit 0

      - name: Compose release notes from the merged pull request
        id: notes
        if: steps.release_check.outputs.exists == 'false' || inputs.force_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $notes = 'dist\release-notes.md'
          $footer = @(
            '',
            '---',
            '',
            '### Portable Windows download',
            '',
            'Grab the zip below, extract it anywhere and run `my_timer.exe` -',
            'no installer, no runtime, no registry entries.'
          )

          $prs = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/pulls" | ConvertFrom-Json
          if ($prs -and $prs.Count -gt 0) {
            $pr = $prs[0]
            $body = $pr.body
            if ([string]::IsNullOrWhiteSpace($body)) { $body = '_No description provided._' }
            $header = "# $($pr.title)`n`n"
            Write-Host "release notes from PR #$($pr.number): $($pr.title)"
          } else {
            $body = "Automated build of $tag."
            $header = "# NOIR CHROME $tag`n`n"
            Write-Host 'no pull request found, falling back to a generic body'
          }

          ($header + $body + ($footer -join "`n")) | Set-Content -Path $notes -Encoding utf8
          "path=$notes" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: steps.release_check.outputs.exists == 'false' || inputs.force_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NOIR CHROME ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          files: ${{ steps.package.outputs.zip }}
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
