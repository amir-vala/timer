name: Flutter Timer CI/CD

on:
  push:
    branches: [ "main" ]

# 🔑 اضافه کردن دسترسی نوشتن برای حل ارور 403 در دیپلوی وب
permissions:
  contents: write

jobs:
  # شغل اول: ساخت و دیپلوی نسخه وب
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Disable Analytics
        run: flutter config --no-analytics

      - name: Generate Missing Platform Folders
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          token: ${{ secrets.GITHUB_TOKEN }}

  # شغل دوم: ساخت نسخه ویندوز
  build-windows:
    runs-on: windows-2019 # 🪟 تغییر به ۲۰۱۹ برای حل ارور CMake و Visual Studio
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Disable Analytics
        run: flutter config --no-analytics

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Generate Windows Platform Folders
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get
        
      - name: Build Windows App
        run: flutter build windows --release

      - name: Zip Windows Build
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "windows-timer-app.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-timer-app
          path: windows-timer-app.zip
