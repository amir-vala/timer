name: Flutter Timer CI/CD

# Runs after a pull request is merged (a push lands on main) and on demand.
# Pull requests do not run CI any more - only merged work is built and released.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Publish (or refresh) the release for the current pubspec version'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  # The tag is read once, from pubspec.yaml, and every other job uses it.
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      full: ${{ steps.read.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pubspec version
        id: read
        shell: bash
        run: |
          line=$(grep -E '^version:' pubspec.yaml | head -n1 | sed 's/^version:[[:space:]]*//')
          tag="v${line%%+*}"
          echo "full=$line" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $line -> $tag"

  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Disable Analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Disable Analytics
        run: flutter config --no-analytics

      # web/ is checked in, so no `flutter create .` scaffolding step is needed
      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  build-windows:
    name: Build Windows (portable)
    needs: version
    runs-on: windows-2022
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Disable Analytics
        run: flutter config --no-analytics

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      # windows/ is checked in, so no `flutter create .` scaffolding step is needed
      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release

      - name: Package portable build
        id: package
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          if (-not (Test-Path (Join-Path $release 'my_timer.exe'))) {
            throw "Windows build missing at $release"
          }

          $stage = 'dist\NOIR-CHROME'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $release '*') $stage -Recurse -Force

          # Everything the app needs is already in that folder; the readme just
          # tells people they do not have to install anything.
          $lines = @(
            'NOIR CHROME - portable Windows build ' + '${{ needs.version.outputs.tag }}',
            '',
            'This folder is fully portable: no installer, no runtime, no registry.',
            'Copy it anywhere and run my_timer.exe.',
            '',
            'Controls:',
            '  Space    start / pause',
            '  R        reset',
            '  C        toggle the 3-minute cycle',
            '  F        focus mode (Esc leaves it)',
            '  T        custom timer',
            '',
            'Built from https://github.com/' + '${{ github.repository }}'
          )
          $lines | Set-Content -Path (Join-Path $stage 'README.txt') -Encoding utf8

          $zip = "dist\NOIR-CHROME-windows-x64-${{ needs.version.outputs.tag }}.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Packaged $zip ($size MB)"
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload Portable Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-CHROME-windows-x64-${{ needs.version.outputs.tag }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  build-android:
    name: Build Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Disable Analytics
        run: flutter config --no-analytics

      # android/ is checked in (including the Gradle wrapper), so no
      # `flutter create .` scaffolding step is needed
      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/NOIR-CHROME-android-${{ needs.version.outputs.tag }}.apk"
          ls -lh dist

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-CHROME-android-${{ needs.version.outputs.tag }}
          path: dist/*.apk
          if-no-files-found: error

  # One release, both platforms. Runs only when every build job passed, and
  # only from main - a manual run on a branch builds but never publishes.
  release:
    name: Publish release
    needs: [version, analyze-test, build-web, build-windows, build-android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download portable Windows build
        uses: actions/download-artifact@v4
        with:
          name: NOIR-CHROME-windows-x64-${{ needs.version.outputs.tag }}
          path: dist

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: NOIR-CHROME-android-${{ needs.version.outputs.tag }}
          path: dist

      - name: List release assets
        run: ls -lh dist

      - name: Check whether this version is already released
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ needs.version.outputs.tag }}'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release $tag already exists - skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "release $tag does not exist yet"
          fi

      - name: Compose release notes from the merged pull request
        id: notes
        if: steps.release_check.outputs.exists == 'false' || inputs.force_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ needs.version.outputs.tag }}'
          mkdir -p dist

          {
            echo ''
            echo '---'
            echo ''
            echo '### Downloads'
            echo ''
            echo "- **Windows (portable)** - \`NOIR-CHROME-windows-x64-$tag.zip\`: unzip anywhere and run \`my_timer.exe\`."
            echo "- **Android** - \`NOIR-CHROME-android-$tag.apk\`: sideload it; it is debug-signed, so Android will ask you to confirm the install."
          } > dist/footer.md

          pr_json=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")
          count=$(echo "$pr_json" | jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "$pr_json" | jq -r '.[0] | "# " + .title + "\n\n" + (.body // "_No description provided._")' > dist/body.md
            echo "release notes from PR #$(echo "$pr_json" | jq -r '.[0].number')"
          else
            printf '# NOIR CHROME %s\n\nAutomated build of %s.\n' "$tag" "$tag" > dist/body.md
            echo "no pull request found, falling back to a generic body"
          fi

          cat dist/body.md dist/footer.md > dist/release-notes.md
          echo "path=dist/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.release_check.outputs.exists == 'false' || inputs.force_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: NOIR CHROME ${{ needs.version.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.zip
            dist/*.apk
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
